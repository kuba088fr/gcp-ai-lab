          - p: >-
              Wymiar urlopu wypoczynkowego wynosi 20 dni dla pracowników ze stażem pracy krótszym niż
              10 lat oraz 26 dni dla pracowników ze stażem co najmniej 10 lat, zgodnie z Kodeksem pracy.
