  - id: doc01
    file: 01_returns_policy.pdf
    language: pl
    render: text
    title: Regulamin sklepu internetowego Lumen Pack
    meta: "Wersja 3.1 | Obowiązuje od: 2025-06-01"
    sections:
      - heading: "§1. Postanowienia ogólne"
        blocks:
          - p: >-
              Sklep internetowy Lumen Pack, dostępny pod adresem lumenpack.example.com, prowadzi
              Lumen Logistics sp. z o.o. Sklep oferuje materiały opakowaniowe: kartony, folię
              stretch, taśmy, wypełniacze i palety. Regulamin określa zasady zawierania umów
              sprzedaży, dostawy, odstąpienia od umowy oraz składania reklamacji.
          - p: >-
              Klientem może być konsument, przedsiębiorca na prawach konsumenta albo przedsiębiorca.
              Postanowienia dotyczące odstąpienia od umowy stosuje się wyłącznie do konsumentów
              i przedsiębiorców na prawach konsumenta.
      - heading: "§2. Zamówienia"
        blocks:
          - p: >-
              Zamówienia przyjmowane są przez całą dobę. Zamówienia złożone w dni robocze do godziny
              13:00 są kompletowane i wysyłane tego samego dnia. Minimalna wartość zamówienia wynosi
              50 zł brutto.
          - p: >-
              Klient otrzymuje potwierdzenie zamówienia na adres e-mail podany w formularzu. Umowa
              sprzedaży zostaje zawarta z chwilą wysłania potwierdzenia.
      - heading: "§3. Ceny i płatności"
        blocks:
          - p: >-
              Ceny w sklepie podane są w złotych polskich i zawierają podatek VAT. Dostępne metody
              płatności to przelew tradycyjny, szybki przelew online oraz płatność kartą. Dla
              przedsiębiorców z podpisaną umową ramową dostępny jest przelew z terminem płatności
              14 dni.
      - heading: "§4. Dostawa"
        blocks:
          - p: >-
              Dostawa paczek realizowana jest przez kuriera w ciągu 1–2 dni roboczych od wysyłki.
              Dostawa palet realizowana jest transportem własnym Lumen Logistics w ciągu 2–3 dni
              roboczych. Przy zamówieniach powyżej 500 zł brutto dostawa paczek jest bezpłatna.
      - heading: "§5. Odstąpienie od umowy i zwroty"
        blocks:
          - p: >-
              Sklep dokłada wszelkich starań, aby zamówione produkty spełniały oczekiwania Klientów,
              a materiały opakowaniowe są pakowane w sposób zabezpieczający je przed uszkodzeniem
              w transporcie. Konsument, który zawarł umowę na odległość, może odstąpić od niej bez
              podawania przyczyny w terminie 14 dni od dnia, w którym wszedł w posiadanie towaru,
              składając oświadczenie przez formularz kontaktowy lub e-mailem na adres
              zwroty@example.com. Do zachowania terminu wystarczy wysłanie oświadczenia przed jego
              upływem. Towar należy odesłać na adres magazynu we Wrocławiu niezwłocznie, nie później
              niż w ciągu 14 dni od złożenia oświadczenia.
          - p: >-
              Sklep zwraca Konsumentowi wszystkie otrzymane płatności, w tym koszt najtańszej
              oferowanej dostawy, w terminie 14 dni od otrzymania oświadczenia o odstąpieniu, przy
              użyciu tej samej metody płatności. Sklep może wstrzymać się ze zwrotem do chwili
              otrzymania towaru. Bezpośrednie koszty odesłania towaru ponosi Konsument, chyba że
              towar był wadliwy.
          - p: >-
              Prawo odstąpienia nie przysługuje w odniesieniu do towarów wykonanych według
              specyfikacji Konsumenta, w szczególności kartonów z nadrukiem indywidualnym.
      - heading: "§6. Reklamacje"
        blocks:
          - p: >-
              Reklamacje można składać e-mailem na adres reklamacje@example.com. Sklep rozpatruje
              reklamację w terminie 30 dni od jej otrzymania i informuje Klienta o decyzji e-mailem.

