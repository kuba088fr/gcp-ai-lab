  - id: doc10
    file: 10_customer_faq_en.pdf
    language: en
    render: text
    title: Customer FAQ – Lumen Logistics
    meta: "Last updated: 2026-05-10"
    sections:
      - heading: "Shipping and delivery"
        blocks:
          - p: >-
              How long does domestic delivery take? Parcels are delivered within 24–48 hours of
              dispatch. Pallets are delivered within 2–3 business days.
          - p: >-
              What is the maximum weight of a pallet? A standard EUR pallet shipment can weigh up to
              1,000 kg, and the maximum loaded height is 1.8 m.
          - p: >-
              Do you ship internationally? We currently deliver only within Poland. We do not handle
              customs clearance.
      - heading: "Tracking"
        blocks:
          - p: >-
              How can I track my shipment? Use the tracking number from your confirmation e-mail on
              track.example.com. Tracking data is updated every 30 minutes.
      - heading: "Customer support"
        blocks:
          - p: >-
              How can I contact support? E-mail support@example.com or call our hotline Monday to
              Friday, 7:00–20:00 (CET). Complaints should be sent to reklamacje@example.com.
