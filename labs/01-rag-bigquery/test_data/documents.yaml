          - p: >-
              Usługodawca wystawia faktury raz w miesiącu. Termin płatności wynosi 21 dni od daty
              wystawienia faktury. Płatności należy dokonywać na rachunek bankowy Usługodawcy
              nr PL00 0000 0000 0000 0000 0000 0000. Rachunek Klienta do zwrotów:
              PL00 0000 0000 0000 0000 0000 0001.
      - heading: "§4. Odpowiedzialność"
        blocks:
          - p: >-
              Odpowiedzialność Usługodawcy za utratę lub uszkodzenie ładunku ograniczona jest do
              kwoty 50 000 zł na jedno zdarzenie, chyba że Klient wykupi ubezpieczenie ładunku (kod U01).
      - heading: "§5. Wypowiedzenie"
        blocks:
          - p: >-
              Każda ze stron może wypowiedzieć umowę z zachowaniem 3-miesięcznego okresu wypowiedzenia
              ze skutkiem na koniec miesiąca kalendarzowego.

