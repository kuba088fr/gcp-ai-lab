  - id: doc05
    file: 05_wms_incident_procedure.pdf
    language: pl
    render: text
    title: Procedura postępowania w przypadku awarii systemu WMS
    meta: "Procedura PR-OPS-07 | Wersja 1.4 | Obowiązuje od: 2025-11-01"
    sections:
      - heading: "1. Cel procedury"
        blocks:
          - p: >-
              Celem procedury jest zapewnienie ciągłości operacji magazynowych w przypadku awarii
              systemu zarządzania magazynem (WMS) oraz ograniczenie opóźnień w wysyłkach do klientów.
              Procedura dotyczy wszystkich magazynów Lumen Logistics: we Wrocławiu i w Poznaniu.
          - p: >-
              System WMS odpowiada za przyjęcia towaru, rozmieszczenie na lokacjach, kompletację
              zamówień, pakowanie i wydania. Awaria WMS oznacza, że pracownicy nie mogą skanować
              etykiet, potwierdzać pobrań ani drukować dokumentów wydania.
      - heading: "2. Definicje"
        blocks:
          - ul:
              - "Awaria – brak możliwości wykonania co najmniej jednej z operacji: przyjęcie, kompletacja, wydanie, przez więcej niż 5 minut."
              - "Kierownik zmiany – osoba odpowiedzialna za magazyn w trakcie danej zmiany."
              - "Dyżurny IT – pracownik działu IT pełniący dyżur telefoniczny 24/7."
              - "Tryb papierowy – awaryjny sposób pracy oparty na wydrukowanych listach kompletacyjnych i ręcznej ewidencji."
      - heading: "3. Wykrycie i zgłoszenie awarii"
        blocks:
          - p: >-
              Każdy pracownik, który zauważy brak działania skanerów lub komunikaty o braku połączenia
              z WMS, niezwłocznie informuje kierownika zmiany. Kierownik zmiany weryfikuje, czy problem
              dotyczy pojedynczego urządzenia, czy całego magazynu, wykonując próbne skanowanie na
              co najmniej trzech różnych terminalach.
          - p: >-
              Jeśli problem dotyczy pojedynczego urządzenia, terminal należy wymienić na zapasowy
              z szafy serwisowej. Jeśli problem dotyczy całego magazynu, kierownik zmiany zgłasza
              awarię w systemie zgłoszeń ServiceDesk z priorytetem P1 oraz rozpoczyna pomiar czasu
              trwania awarii.
      - heading: "4. Pierwsze 45 minut awarii"
        blocks:
          - p: >-
              W pierwszej fazie awarii zespół nie przechodzi na tryb papierowy, ponieważ większość
              awarii WMS jest usuwana w krótkim czasie, a przejście na tryb papierowy i powrót z niego
              generują ryzyko błędów w stanach magazynowych. W tym czasie pracownicy wykonują prace
              niewymagające systemu: porządkowanie stref, przygotowanie opakowań, rozładunek dostaw
              bez ich przyjmowania na stan.
          - p: >-
              Kierownik zmiany co 15 minut sprawdza status zgłoszenia w ServiceDesk i informuje zespół
              o postępach. Gdy czas trwania awarii przekroczy 45 minut, faza pierwsza zostaje
              zakończona.
      - heading: "5. Uruchomienie trybu papierowego"
        blocks:
          - p: >-
              Po zakończeniu fazy pierwszej kierownik zmiany uruchamia tryb papierowy oraz telefonicznie
              powiadamia dyżurnego IT pod numerem wewnętrznym 4410. Kierownik zmiany powiadamia również
              dział obsługi klienta, który informuje klientów kluczowych o możliwych opóźnieniach.
          - ol:
              - "Wydrukuj z zapasowego serwera raportowego ostatnią dostępną listę zamówień do kompletacji."
              - "Przydziel zamówienia kompletującym według stref magazynu."
              - "Każde pobranie odnotuj ręcznie na liście: lokacja, indeks, ilość, podpis."
              - "Zamówienia z priorytetem EXPRESS kompletuj w pierwszej kolejności."
              - "Wydania dokumentuj na formularzu awaryjnym F-OPS-07-A w dwóch egzemplarzach."
      - heading: "6. Przywrócenie systemu"
        blocks:
          - p: >-
              Po przywróceniu działania WMS dyżurny IT potwierdza kierownikowi zmiany gotowość systemu.
              Wszystkie operacje zarejestrowane ręcznie należy wprowadzić do WMS w ciągu 4 godzin od
              przywrócenia systemu. Za wprowadzenie danych odpowiada kierownik zmiany, który może
              wyznaczyć do tego dwóch pracowników.
          - p: >-
              Po wprowadzeniu danych wykonuje się inwentaryzację kontrolną lokacji, z których
              pobierano towar w trybie papierowym. Rozbieżności powyżej 2% wymagają wyjaśnienia
              i raportu do kierownika magazynu.
      - heading: "7. Raport po awarii"
        blocks:
          - p: >-
              W ciągu 2 dni roboczych od zakończenia awarii kierownik magazynu przygotowuje raport
              zawierający: czas trwania awarii, liczbę opóźnionych zamówień, przyczynę (na podstawie
              informacji od działu IT) oraz rekomendacje działań zapobiegawczych. Raport przekazywany
              jest dyrektorowi operacyjnemu.
      - heading: "8. Szkolenia i testy"
        blocks:
          - p: >-
              Każdy kierownik zmiany przechodzi szkolenie z niniejszej procedury przy rozpoczęciu
              pracy na stanowisku oraz raz w roku. Test trybu papierowego przeprowadzany jest
              w każdym magazynie raz na kwartał, poza okresem szczytu sprzedażowego (listopad–grudzień).

