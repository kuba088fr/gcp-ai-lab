# Known facts planted in documents.yaml.
# This is the seed of the golden set used in step 1.7 and lab 04.
#
# tags:
#   basic          - single fact, single document
#   distractor     - similar facts nearby (e.g. several "14 days")
#   version        - two versions of a document disagree; the newer one wins
#   table          - answer lives in a table
#   numeric        - exact number; easy to hallucinate
#   multi_hop      - needs facts from 2+ documents
#   chunk_boundary - condition and action are in different sections
#   ocr            - answer only in the scanned (image-only) PDF
#   cross_language - Polish question, English document
#   conflict       - documents contradict each other; a good answer says so
#   pii            - answer contains personal data (lab 05: should be refused/masked)
#   negative       - answer is NOT in the corpus; a good answer says "I don't know"

